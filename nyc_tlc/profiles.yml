nyc_tlc:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('SQL_SERVER') }}"
      port: "{{ env_var('SQL_PORT') | int }}"
      database: "{{ env_var('SQL_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('SQL_USER') }}"
      password: "{{ env_var('SQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4

    prod:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('SQL_SERVER') }}"
      port: "{{ env_var('SQL_PORT') | int }}"
      database: "{{ env_var('SQL_PROD_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('SQL_USER') }}"
      password: "{{ env_var('SQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4