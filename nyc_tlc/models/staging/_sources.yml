version: 2

sources:
  - name: raw
    description: "Raw NYC TLC data loaded by ingestion/load_raw.py"
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 30, period: day}

    tables:
      - name: fhv_trips
        description: "FHV trip records, one row per trip, loaded per monthly parquet file"
        columns:
          - name: dispatching_base_num
            description: "Base that dispatched the trip; join key to vehicles"
            tests:
              - not_null
          - name: pickup_datetime
            tests:
              - not_null

      - name: fhv_vehicles
        description: "Current state of TLC-licensed FHVs; full refresh each load"
        columns:
          - name: vehicle_license_number
            description: "Natural key of a vehicle"
            tests:
              - not_null
              - unique